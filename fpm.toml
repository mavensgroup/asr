name = "asr"
version = "0.1.0"
license = "MIT"
author = "Rudra Banerjee"
description = "Augmented space recursion for disordered alloys"

[build]
auto-executables = true
auto-tests = true
auto-examples = false
link = ["xc"]

[install]
library = true

[dependencies]
toml-f = { git = "https://github.com/toml-f/toml-f", tag = "v0.5.2" }

# Diagnostic programs (probe/): convergence studies and route comparisons that print results and take arguments.
# They are not tests.  Build with the rest; run with `fpm run --example <name> -- <arguments>`.

[[example]]
name = "probe_ag_dos"
source-dir = "probe"
main = "probe_ag_dos.f90"

[[example]]
name = "probe_alloy_scf"
source-dir = "probe"
main = "probe_alloy_scf.f90"

