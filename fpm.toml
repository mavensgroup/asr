# Slow tests (test_slow/): self-consistent and enumeration tests that take 25 s to several minutes each.  They assert like
# the tests in test/, but fpm test leaves them out so that it stays fast.  Run them all with asr_test_slow (env.sh), or one with
# `fpm run --example NAME`; a failed check gives a nonzero exit code.

[[example]]
name = "test_alloy_b2"
source-dir = "test_slow"
main = "test_alloy_b2.f90"

