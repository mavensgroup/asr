# Ordered B2 CuZn (mp-987, a = 2.92055 A) by the real-space recursion: no augmented space, exact Madelung.
[calculation]
name = "B2 CuZn real-space ED"
kind = "alloy"

[structure]
lattice = "b2"
alat = 2.92055

[[species]]
symbol = "Cu"
z = 29
nval = 11
konfig = [4, 4, 3, 4]
occupations = [1.0, 10.0]

[[species]]
symbol = "Zn"
z = 30
nval = 12
konfig = [4, 4, 3, 4]
occupations = [2.0, 10.0]

[scf]
spin = 1
xc = "vbh"
mixing = 0.3
tolerance = 1.0e-6
max_iterations = 80

[asr]
levels = 12
hamiltonian = "energy-dependent"
supercell = 6
contour_points = 24

[dos]
emin = -0.9
emax = 0.6
npoints = 121
eta = 0.01

[output]
dos_file = "cuzn_b2_ed_dos.dat"
