# Ordered B2 CuZn by the energy-dependent recursion.
[calculation]
name = "B2 CuZn"

[structure]
lattice = "bcc"
alat = 2.92055
period = 1
centering = "P"          # two sublattices: cube corner and cube centre

[[sublattice]]
name = "a"
positions = [[0.0, 0.0, 0.0]]
species = ["Cu"]

[[sublattice]]
name = "b"
positions = [[0.5, 0.5, 0.5]]
species = ["Zn"]

[[species]]
symbol = "Cu"
z = 29
nval = 11
konfig = [4, 4, 3, 4]
occupations = [1.0, 10.0]

[[species]]
symbol = "Zn"
z = 30
nval = 12
konfig = [4, 4, 3, 4]
occupations = [2.0, 10.0]

[scf]
spin = 1
xc = "vbh"
mixing = 0.3
tolerance = 1.0e-5
max_iterations = 80

[asr]
recursion_steps = 24
supercell = 12
contour_points = 32

[dos]
emin = -0.9
emax = 0.6
npoints = 401
eta = 0.01

[output]
dos_file = "cuzn_b2_dos.dat"
