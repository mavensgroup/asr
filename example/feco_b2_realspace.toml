# Ordered B2 FeCo, ferromagnetic, by the real-space recursion (energy-independent H^(2), standard TB-LMTO screening).
# k-space counterpart: example/feco_b2.toml.
[calculation]
name = "B2 FeCo FM real-space"
kind = "alloy"

[structure]
lattice = "b2"
alat = 2.857             # Angstrom

[[species]]
symbol = "Fe"
z = 26
nval = 8
konfig = [4, 4, 3, 4]
occupations = [2.0, 6.0]

[[species]]
symbol = "Co"
z = 27
nval = 9
konfig = [4, 4, 3, 4]
occupations = [2.0, 7.0]

[scf]
spin = 2
xc = "vbh"
mixing = 0.2
zeta0 = 0.1
tolerance = 1.0e-6
max_iterations = 200

[asr]
levels = 24
supercell = 12
contour_points = 80

[dos]
emin = -0.9
emax = 0.6
npoints = 601
eta = 0.01

[output]
dos_file = "feco_b2_realspace_dos.dat"
