# Self-consistent fcc Ag, everything generated by our own LMTO (no tabulated parameters).
#   asr example/ag_fcc.toml        (outputs are written next to this file)
[calculation]
name = "fcc Ag"
kind = "lmto"

[structure]
lattice = "fcc"
alat = 4.0900            # Angstrom (experimental)

[[species]]
symbol = "Ag"
z = 47
nval = 11
konfig = [5, 5, 4, 4]    # valence principal quantum numbers s,p,d,f; lower states are core
occupations = [1.0, 10.0] # neutral-atom valence s and d occupations (starting potential only)

[scf]
spin = 1
xc = "vbh"
nk = 12
bz = "tetra"
mixing = 0.3
tolerance = 1.0e-6
max_iterations = 100

[dos]
emin = -0.9
emax = 1.0
npoints = 801
smear = 0.01
nk = 24

[output]
dos_file = "ag_fcc_dos.dat"
params_file = "ag_fcc_params.dat"
