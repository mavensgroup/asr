# fcc Ag, k-space TB-LMTO-ASA (the exact reference of the ordered crystal).
[calculation]
name = "fcc Ag"
method = "kspace"

[structure]
lattice = "fcc"
alat = 4.0900            # Angstrom (experimental)
centering = "F"          # one sublattice: the fcc lattice itself

[[sublattice]]
name = "fcc"
positions = [[0.0, 0.0, 0.0]]
species = ["Ag"]

[[species]]
symbol = "Ag"
z = 47
nval = 11
konfig = [5, 5, 4, 4]
occupations = [1.0, 10.0]

[scf]
spin = 1
xc = "vbh"
mixing = 0.3
tolerance = 1.0e-6
max_iterations = 100

[kspace]
nk = 12
bz = "tetra"
dos_nk = 24

[dos]
emin = -0.9
emax = 1.0
npoints = 801
eta = 0.01

[output]
dos_file = "ag_fcc_dos.dat"
params_file = "ag_fcc_params.dat"
