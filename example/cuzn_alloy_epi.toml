# Random bcc Cu0.5Zn0.5 (A2) with the effective pair interactions of the first three shells ([epi], asr_epi).
# The run writes cuzn_epi.toml.  Short-range order parameters at a temperature:
#   python3 -I tools/sro_alpha/sro_alpha.py example/cuzn_epi.toml -T 1200 1000 800 600 --cool --kcm
[calculation]
name = "CuZn bcc alloy, pair interactions"

[structure]
lattice = "bcc"
alat = 2.85              # Angstrom
centering = "I"

[[sublattice]]
name = "bcc"
positions = [[0.0, 0.0, 0.0]]
species = ["Cu", "Zn"]
concentrations = [0.5, 0.5]

[[species]]
symbol = "Cu"
z = 29
nval = 11
konfig = [4, 4, 3, 4]
occupations = [1.0, 10.0]

[[species]]
symbol = "Zn"
z = 30
nval = 12
konfig = [4, 4, 3, 4]
occupations = [2.0, 10.0]

[scf]
spin = 1
xc = "vbh"
sim_beta = 1.0
mixing = 0.3
max_iterations = 60

[asr]
levels = 4               # augmented-space generations
recursion_steps = 24     # Lanczos steps; convergence must be checked
rank = 1                 # max flipped sites per augmented-space state
supercell = 8            # graph size in conventional cells
contour_points = 32

[epi]
shells = 3               # coordination shells (8, 6 and 12 sites on bcc)
lambda_points = 4        # nodes of the species path Cu -> Zn
file = "cuzn_epi.toml"

[dos]
emin = -0.9
emax = 0.7
npoints = 401
eta = 0.02

[output]
dos_file = "cuzn_epi_dos.dat"
out_file = "cuzn_epi.out"
