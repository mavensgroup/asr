# Ordered bcc nearest-neighbour single-band model (hopping in units of t).
# Run from anywhere:   asr example/bcc_ordered.toml
# Output is written next to this file.
[calculation]
name = "bcc NN s-band"
kind = "model"

[structure]
lattice = "bcc"

[model]
hopping = 1.0

[recursion]
nlevels = 40
terminator = "sqrt-avg2"

[dos]
emin = -10.0
emax = 10.0
eta = 0.05
npoints = 801

[output]
dos_file = "bcc_ordered_dos.dat"
