# Ordered B2 FeCo, ferromagnetic, by the energy-dependent recursion (default method).  k-space: example/feco_b2_kspace.toml.
[calculation]
name = "B2 FeCo FM, recursion"

[structure]
lattice = "bcc"
alat = 2.857             # Angstrom
period = 1
centering = "P"          # two sublattices: cube corner and cube centre

[[sublattice]]
name = "a"
positions = [[0.0, 0.0, 0.0]]
species = ["Fe"]

[[sublattice]]
name = "b"
positions = [[0.5, 0.5, 0.5]]
species = ["Co"]

[[species]]
symbol = "Fe"
z = 26
nval = 8
konfig = [4, 4, 3, 4]
occupations = [2.0, 6.0]

[[species]]
symbol = "Co"
z = 27
nval = 9
konfig = [4, 4, 3, 4]
occupations = [2.0, 7.0]

[scf]
spin = 2
xc = "vbh"
mixing = 0.2
zeta0 = 0.1
tolerance = 1.0e-5
max_iterations = 200

[asr]
recursion_steps = 24     # Lanczos steps (ordered: one component per sublattice)
supercell = 12
contour_points = 32

[dos]
emin = -0.9
emax = 0.6
npoints = 601
eta = 0.01

[output]
dos_file = "feco_b2_asr_dos.dat"
