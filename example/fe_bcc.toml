# bcc Fe, ferromagnetic, k-space TB-LMTO-ASA.  Delete the method line (and [kspace]) to run the same input by the recursion.
[calculation]
name = "bcc Fe"
method = "kspace"

[structure]
lattice = "bcc"
alat = 2.8665
centering = "I"          # one sublattice: the bcc lattice itself

[[sublattice]]
name = "bcc"
positions = [[0.0, 0.0, 0.0]]
species = ["Fe"]

[[species]]
symbol = "Fe"
z = 26
nval = 8
konfig = [4, 4, 3, 4]
occupations = [2.0, 6.0]

[scf]
spin = 2
zeta0 = 0.4              # initial spin polarisation (seed)
xc = "vbh"
mixing = 0.3
tolerance = 1.0e-5
max_iterations = 200

[kspace]
nk = 16
bz = "tetra"
dos_nk = 24

[dos]
emin = -0.9
emax = 0.8
npoints = 801
eta = 0.01

[output]
dos_file = "fe_bcc_dos.dat"
params_file = "fe_bcc_params.dat"
