# Ordered B2 FeCu, k-space, unequal ASA spheres.
[calculation]
name = "B2 FeCu"
method = "kspace"

[structure]
lattice = "bcc"
alat = 3.0               # Angstrom
period = 1
centering = "P"          # two sublattices: cube corner and cube centre

[[sublattice]]
name = "a"
positions = [[0.0, 0.0, 0.0]]
species = ["Fe"]

[[sublattice]]
name = "b"
positions = [[0.5, 0.5, 0.5]]
species = ["Cu"]

[[species]]
symbol = "Fe"
z = 26
nval = 8
konfig = [4, 4, 3, 4]
occupations = [2.0, 6.0]

[[species]]
symbol = "Cu"
z = 29
nval = 11
konfig = [4, 4, 3, 4]
occupations = [1.0, 10.0]

[scf]
spin = 1
xc = "vbh"
mixing = 0.3
tolerance = 1.0e-6
max_iterations = 100

[kspace]
nk = 12
bz = "tetra"
dos_nk = 24
sphere_ratio = 1.0968    # r_Fe / r_Cu (sublattice at the origin over the other; spheres fill the cell volume)

[dos]
emin = -0.9
emax = 0.6
npoints = 801
eta = 0.01

[output]
dos_file = "fecu_b2_dos.dat"
params_file = "fecu_b2_params.dat"
