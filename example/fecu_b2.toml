# Ordered B2 (CsCl) FeCu, nonmagnetic; two classes, Madelung and charge transfer included.
[calculation]
name = "B2 FeCu"
kind = "lmto"

[structure]
lattice = "b2"
alat = 3.0               # Angstrom
ratio = 1.0968           # sphere radius ratio r_Fe / r_Cu (spheres fill the cell volume)

[[species]]
symbol = "Fe"
z = 26
nval = 8
konfig = [4, 4, 3, 4]
occupations = [2.0, 6.0]

[[species]]
symbol = "Cu"
z = 29
nval = 11
konfig = [4, 4, 3, 4]
occupations = [1.0, 10.0]

[scf]
spin = 1
xc = "vbh"
nk = 12
bz = "tetra"
mixing = 0.3
tolerance = 1.0e-6
max_iterations = 100

[dos]
emin = -0.9
emax = 0.6
npoints = 801
smear = 0.01
nk = 24

[output]
dos_file = "fecu_b2_dos.dat"
params_file = "fecu_b2_params.dat"
