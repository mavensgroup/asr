[book]
title = "asr"
authors = ["Rudra Banerjee"]
description = "Augmented-space recursion suite for disordered materials"
language = "en"
src = "manual"

[build]
build-dir = "build/book"
create-missing = false

[preprocessor.frontmatter]
command = "../tools/mdbook_frontmatter.py"

[output.html]
theme = "theme"
additional-css = ["custom.css"]
additional-js = ["custom.js"]
mathjax-support = true
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mavensgroup/asr"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
